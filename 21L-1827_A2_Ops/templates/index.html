{% extends "base.html" %}
{% block content %}
<h1>Check an image</h1>
<form class="upload" action="{{ url_for('predict_route') }}" method="post" enctype="multipart/form-data">
  <label class="file-button" for="image">Select image</label>
  <input id="image" type="file" name="image" accept=".jpg,.jpeg,.png" required>
  <span id="file-name" class="muted">No file selected</span>
  <button type="submit" class="submit">Submit</button>
</form>
<p class="muted small">JPG or PNG, up to {{ max_mb }} MB. Images are not stored.</p>
<script>
  document.getElementById("image").addEventListener("change", function (e) {
    const name = e.target.files.length ? e.target.files[0].name : "No file selected";
    document.getElementById("file-name").textContent = name;
  });
</script>
{% endblock %}
