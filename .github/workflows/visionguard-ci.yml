name: VisionGuard CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: 21L-1827_A2_Ops

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 21L-1827_A2_Ops/Requirements.txt

      - name: Install dependencies
        run: |
          pip install -r Requirements.txt
          pip install tensorflow-cpu==2.17.1 ruff pytest

      - name: Lint
        run: ruff check app.py inference.py config.py export_champion.py tests/

      - name: Test
        env:
          VISIONGUARD_DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q

      - name: Fetch champion model
        env:
          MLFLOW_TRACKING_URL: ${{ secrets.MLFLOW_TRACKING_URL }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python export_champion.py

      - name: Build Docker image
        run: docker build -t visionguard-web .